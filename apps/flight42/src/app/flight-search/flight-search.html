<div class="card">
  <div class="card-header">
    <h2 class="card-title">Flight Search</h2>
  </div>
  <div class="card-body">
    <form [formRoot]="searchForm">
      <div class="form-group">
        <label for="from">From</label>
        <input [formField]="searchForm.from" id="from" class="form-control">
      </div>
      <div class="form-group">
        <label for="to">To</label>
        <input [formField]="searchForm.to" id="to" class="form-control">
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-default">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

@if (flightResource.hasValue() && flightResource.value().length) {
  <div class="card">
    <div class="card-body">
      <table class="table table-condensed">
        <thead>
          <tr>
            <th>ID</th>
            <th>From</th>
            <th>To</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (flight of flightResource.value(); track flight.id) {
            <tr>
              <td>{{ flight.id }}</td>
              <td>{{ flight.from }}</td>
              <td>{{ flight.to }}</td>
              <td>{{ flight.date | date:'dd.MM.yyyy HH:mm' }}</td>
              <td></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
